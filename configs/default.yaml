# Optional Roboflow cloud backend (only when detection.backend=roboflow)
roboflow:
  model_id: ""  # Set your RF-DETR model ID here
  api_key_env: "ROBOFLOW_API_KEY"

# Gameplay gate / scene-cut (Phase 1 Step 1)
camera:
  # Match 3 wide cams often sit under 0.5 green fraction; 0.25 keeps gate useful.
  green_threshold: 0.25
  scene_cut_threshold: 0.7

# Detection Settings
# Low detect floor feeds ByteTrack; product emit gate is tracker.emit_thresh (~0.80).
detection:
  backend: local_rfdetr  # local_rfdetr | roboflow
  confidence_threshold: 0.10
  player_class_id: 0
  ball_class_id: 1
  player_checkpoint: models/people_after_100_epochs.pth
  ball_checkpoint: models/v12_hard_snaps/post_train/checkpoint.pth
  enhance_ball: true
  use_sahi: false  # C2: SAHI no gain vs v12_plain; keep off for batch throughput
  use_kalman: true
  player_nms_iou: 0.3  # torso/legs + vertical-stack merge in _is_duplicate_player
  ball_nms_iou: 0.4

# Tracker Settings (ByteTrack)
# Ingest low-conf dets for association; publish balls only if tracklet EMA >= emit_thresh.
tracker:
  track_thresh: 0.10
  high_thresh: 0.35
  track_buffer: 30
  match_thresh: 0.8
  frame_rate: 30
  emit_thresh: 0.80
  ema_alpha: 0.3
  apply_emit_gate: true

# Team Assignment
team_assignment:
  kmeans_clusters: 2
  color_space: "RGB"

# Coordinate Mapping
mapping:
  pitch_length: 53.9   # Pitch 1 measured (docs/product/PITCH1_DIMENSIONS.json)
  pitch_width: 34.84
  homography_method: "manual"  # or "auto"

# Event Detection
events:
  pass_velocity_threshold: 5.0  # m/s
  dribble_distance_threshold: 2.0  # meters
  shot_velocity_threshold: 15.0  # m/s
  recovery_proximity: 1.0  # meters
  emit_conf: 0.80  # below → do nothing (Phase 1)
  # Pitch 1 half-length from centre (53.90/2); never FIFA 52.5
  half_length_m: 26.95
  shot_goal_band_m: 5.0
  enable_dribble: true
  enable_movement: true
  movement_velocity_min: 1.0  # m/s; below pass_velocity_threshold
  movement_proximity: 4.0  # meters
  co_move_min_player_m: 0.15  # player must move with ball (anti map jitter)
  co_move_min_cos: 0.55  # displacement alignment for dribble/movement
  dribble_window_frames: 2  # stride-4 fuse has ~2 cling steps per carry
  dribble_min_carry_m: 0.55  # 3062→3070 carry ~0.58 m on fuse gold
  dribble_co_move_streak: 1  # both cling steps co-move on fuse carry

# Checkpoint Settings
checkpoint:
  interval_frames: 300  # Save every N frames
  output_dir: "data/output/checkpoints"

# Output Settings
output:
  csv_path: "data/output/events.csv"
  json_path: "data/output/events.json"
  frame_data_path: "data/output/frame_data.csv"
