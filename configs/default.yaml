roboflow:
  model_id: ''
  api_key_env: ROBOFLOW_API_KEY
camera:
  green_threshold: 0.25
  scene_cut_threshold: 0.7
detection:
  backend: local_rfdetr
  confidence_threshold: 0.1
  player_class_id: 0
  ball_class_id: 1
  player_checkpoint: models/people_after_100_epochs.pth
  ball_checkpoint: models/v16_residual_snaps/post_train/checkpoint.pth
  enhance_ball: true
  use_sahi: false
  use_kalman: true
  player_nms_iou: 0.3
  ball_nms_iou: 0.4
tracker:
  track_thresh: 0.1
  high_thresh: 0.35
  track_buffer: 30
  match_thresh: 0.8
  frame_rate: 30
  emit_thresh: 0.8
  ema_alpha: 0.3
  apply_emit_gate: true
team_assignment:
  kit_mode: auto
  kit_centroids_path: ''
  min_session_crops: 20
  fuse_max_players: 14
  golden_batch_frames: 600
  min_tracklets: 15
  assign_conf: 0.55
  kmeans_clusters: 2
  color_space: RGB
  strategy: auto_traj_no_gray
mapping:
  pitch_length: 53.9
  pitch_width: 34.84
  homography_method: manual
fuse:
  mode: pitch_merge
  ukf_enabled: false
  # A/B 2026-09-04: all >> quad on holdout clear_R (+0.16) and agree (+0.26); strips pass.
  # See reports/eval_match3/improve_eng_loop/ab_fuse_cams_quad_vs_all.json
  cams: all
  fallback_pitch_merge: true
  reproj_max_px:
    P7: 48
    P8: 48
    P9: 48
    P10: 48
    P1: 72
    P6: 72
    P_Goal1: 80
    P_Goal2: 80
events:
  pass_velocity_threshold: 5.0
  dribble_distance_threshold: 2.0
  shot_velocity_threshold: 15.0
  recovery_proximity: 1.0
  emit_conf: 0.8
  half_length_m: 26.95
  shot_goal_band_m: 5.0
  max_ball_speed_m_s: 40.0
  max_player_step_m: 6.0
  enable_dribble: true
  enable_movement: true
  movement_velocity_min: 1.0
  movement_proximity: 4.0
  co_move_min_player_m: 0.15
  co_move_min_cos: 0.55
  dribble_window_frames: 2
  dribble_min_carry_m: 0.55
  dribble_co_move_streak: 1
  movement_window_frames: 2
  movement_min_carry_m: 0.35
checkpoint:
  interval_frames: 300
  output_dir: data/output/checkpoints
output:
  csv_path: data/output/events.csv
  json_path: data/output/events.json
  frame_data_path: data/output/frame_data.csv
