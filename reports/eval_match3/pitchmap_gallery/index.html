<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Match 3 — video + pitch (x,y)</title>
<style>
:root { --bg:#121612; --panel:#1c241c; --text:#eef2ee; --muted:#9aab9a; --accent:#e8c547; }
* { box-sizing: border-box; }
body { margin:0; font-family:"IBM Plex Sans",Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
main { max-width: 1280px; margin: 0 auto; padding: 1.2rem 1.4rem 2rem; }
h1 { font-family:"IBM Plex Serif",Georgia,serif; font-size:1.45rem; font-weight:600; margin:0 0 .35rem; }
.sub { color:var(--muted); font-size:.9rem; line-height:1.45; margin-bottom:1rem; max-width:52rem; }
.bar { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; margin-bottom:.9rem; }
label { color:var(--muted); font-size:.85rem; }
select {
  background:var(--panel); color:var(--text); border:1px solid #3a4a3a;
  padding:.55rem .7rem; border-radius:6px; font-size:.95rem; min-width:min(100%, 420px);
}
select:focus { outline:1px solid var(--accent); }
video { width:100%; background:#000; border-radius:8px; display:block; }
.meta { margin-top:.65rem; color:var(--muted); font-size:.82rem; }
code { color:var(--accent); }
</style>
</head><body><main>
<h1>Match 3 — fused pitch (x,y)</h1>
<p class="sub">
  Five random 5-second windows from <code>data/raw/Match 3</code>
  (P1, P6, P7, P8, P9, P10, P_Goal1, P_Goal2).
  Left = selected cam / ball; right = Pitch 1 meters from 4-click H
  (bbox foot, 4 m fuse, emit ≥ 0.80, F0 detect-tick hold).
</p>
<div class="bar">
  <label for="clip">Clip</label>
  <select id="clip"><option value="rand_627" data-src="/reports/eval_match3/pitchmap_gallery/clips/rand_627/rand_t00627.9s_video_pitch.mp4?v=fpost">Random 10:28 · 10:28–10:33</option>
<option value="rand_931" data-src="/reports/eval_match3/pitchmap_gallery/clips/rand_931/rand_t00931.2s_video_pitch.mp4?v=fpost">Random 15:31 · 15:31–15:36</option>
<option value="rand_1162" data-src="/reports/eval_match3/pitchmap_gallery/clips/rand_1162/rand_t01162.3s_video_pitch.mp4?v=fpost">Random 19:22 · 19:22–19:27</option>
<option value="rand_1237" data-src="/reports/eval_match3/pitchmap_gallery/clips/rand_1237/rand_t01237.3s_video_pitch.mp4?v=fpost">Random 20:37 · 20:37–20:42</option>
<option value="rand_1714" data-src="/reports/eval_match3/pitchmap_gallery/clips/rand_1714/rand_t01714.0s_video_pitch.mp4?v=fpost">Random 28:34 · 28:34–28:39</option></select>
</div>
<video id="player" controls autoplay muted loop></video>
<p class="meta" id="meta"></p>
<script>
const entries = [{"id": "rand_627", "label": "Random 10:28", "clock": "10:28\u201310:33", "url": "/reports/eval_match3/pitchmap_gallery/clips/rand_627/rand_t00627.9s_video_pitch.mp4?v=fpost", "page": "/reports/eval_match3/pitchmap_gallery/clips/rand_627/", "n_frames": 150, "n_emit": 63, "n_agree": 0, "policy": "match3_pitch_fuse"}, {"id": "rand_931", "label": "Random 15:31", "clock": "15:31\u201315:36", "url": "/reports/eval_match3/pitchmap_gallery/clips/rand_931/rand_t00931.2s_video_pitch.mp4?v=fpost", "page": "/reports/eval_match3/pitchmap_gallery/clips/rand_931/", "n_frames": 150, "n_emit": 55, "n_agree": 29, "policy": "match3_pitch_fuse"}, {"id": "rand_1162", "label": "Random 19:22", "clock": "19:22\u201319:27", "url": "/reports/eval_match3/pitchmap_gallery/clips/rand_1162/rand_t01162.3s_video_pitch.mp4?v=fpost", "page": "/reports/eval_match3/pitchmap_gallery/clips/rand_1162/", "n_frames": 150, "n_emit": 27, "n_agree": 2, "policy": "match3_pitch_fuse"}, {"id": "rand_1237", "label": "Random 20:37", "clock": "20:37\u201320:42", "url": "/reports/eval_match3/pitchmap_gallery/clips/rand_1237/rand_t01237.3s_video_pitch.mp4?v=fpost", "page": "/reports/eval_match3/pitchmap_gallery/clips/rand_1237/", "n_frames": 150, "n_emit": 6, "n_agree": 0, "policy": "match3_pitch_fuse"}, {"id": "rand_1714", "label": "Random 28:34", "clock": "28:34\u201328:39", "url": "/reports/eval_match3/pitchmap_gallery/clips/rand_1714/rand_t01714.0s_video_pitch.mp4?v=fpost", "page": "/reports/eval_match3/pitchmap_gallery/clips/rand_1714/", "n_frames": 150, "n_emit": 55, "n_agree": 0, "policy": "match3_pitch_fuse"}];
const byId = Object.fromEntries(entries.map(e => [e.id, e]));
const sel = document.getElementById('clip');
const player = document.getElementById('player');
const meta = document.getElementById('meta');
function show(id) {
  const e = byId[id];
  if (!e) return;
  player.src = e.url;
  player.play().catch(() => {});
  const emit = (e.n_emit == null) ? "" : ` · emit ${e.n_emit}/${e.n_frames} · agree ${e.n_agree}`;
  meta.innerHTML = `<b>${e.label}</b> · ${e.clock} · <code>${e.id}</code>${emit}`;
  history.replaceState(null, '', '#' + id);
}
sel.addEventListener('change', () => show(sel.value));
const initial = (location.hash || '').slice(1) || entries[0].id;
if (byId[initial]) sel.value = initial;
show(sel.value);
</script>
</main></body></html>
