[server]
headless = true
address = "127.0.0.1"
enableCORS = false
enableXsrfProtection = false
fileWatcherType = "none"
maxUploadSize = 200
enableWebsocketCompression = true
maxMessageSize = 50
# port left unset — each launcher sets --server.port / --browser.serverPort

[browser]
gatherUsageStats = false
serverAddress = "127.0.0.1"
# serverPort left unset — must match the launcher port (8501 review, 8502 emit labels)

[runner]
fastReruns = true
enforceSerializableSessionState = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
